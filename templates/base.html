<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a1d37">
    <title>{% block title %}Fare Path{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('index') }}" aria-label="Fare Path home">
        <span class="brand-mark">✦</span> Fare Path
      </a>
      <nav class="primary-nav" aria-label="Primary navigation">
        <a class="primary-nav-link {% if request.endpoint in ['index', 'search'] %}active{% endif %}"
           href="{{ url_for('index') }}" {% if request.endpoint in ['index', 'search'] %}aria-current="page"{% endif %}>Search</a>
        <a class="primary-nav-link {% if request.endpoint == 'fare_history' %}active{% endif %}"
           href="{{ url_for('fare_history') }}" {% if request.endpoint == 'fare_history' %}aria-current="page"{% endif %}>Fare History</a>
        <a class="primary-nav-link {% if request.endpoint == 'monitor_dashboard' %}active{% endif %}" href="{{ url_for('monitor_dashboard') }}">Fare Monitoring</a>
      </nav>
      <span class="header-note">Flexible fares, deliberate searches</span>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>Personal flight-search assistant · Prices and availability can change.</footer>
  </body>
</html>
