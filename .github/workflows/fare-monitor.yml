name: Fare monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fare-monitor-scheduler
  cancel-in-progress: false

jobs:
  run-due-monitors:
    # Dispatch and schedule both require the explicit repository variable.
    if: ${{ vars.FARE_MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FARE_MONITOR_ENABLED: ${{ vars.FARE_MONITOR_ENABLED }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MAX_WEB_SERPAPI_BUDGET: "50"
      MONITOR_MAX_SERPAPI_BUDGET: "50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Require shared PostgreSQL configuration
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then echo "DATABASE_URL secret is required; refusing ephemeral SQLite." >&2; exit 1; fi
      - name: Check shared database connectivity
        run: flask --app webapp db-ready
      - name: Run due monitoring jobs
        run: flask --app webapp run-due-monitors
