name: Fare monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-due-monitors:
    if: ${{ vars.FARE_MONITOR_ENABLED == 'true' }}
    runs-on: [self-hosted, fare-monitor]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run due jobs against durable database
        env:
          FLIGHT_DATABASE_PATH: ${{ secrets.FLIGHT_DATABASE_PATH }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_WEB_SERPAPI_BUDGET: "12"
        run: |
          if [ -z "$FLIGHT_DATABASE_PATH" ]; then echo "FLIGHT_DATABASE_PATH must identify mounted persistent storage"; exit 1; fi
          flask --app webapp run-due-monitors
